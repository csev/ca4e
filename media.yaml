    description: |
      In this video we look at analog computing devices that use mechanical mechanisms like slides, gears or rotation to do complex calculations physically.  Precision construction and precise scales on these devices is an important aspect of continuous analog computation devices.  We look at the Antikythera, Slide Rule, and the E6B calculator that pilots use to compute how airplanes adjust their heading to compensate for winds while in the air.

      Course materials and assessments: https://www.ca4e.com

      Antikythera Solar System Model on Amazon: https://amzn.to/430lHGz

      E6B Pilot Calculator on Amazon: https://amzn.to/47vQvR7

