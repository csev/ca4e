      In this walk through, we build a CMOS NOR gate step by step using the CMOS layout editor from Computer Architecture for Everybody. This video serves both as an assignment example and a guided tour of the layout tool’s core features.

      You’ll learn how to:

      Add switches for inputs and probes for outputs

      Place and wire NMOS and PMOS transistors

      Understand how CMOS behavior maps directly to logic gates

      Save and reload circuits using browser-based local storage

      We follow the reference diagram from lecture, test all input combinations, and verify that the circuit behaves exactly as a NOR gate should—outputting HIGH only when both inputs are LOW.

      This video is ideal if you’re:

      Working through the CMOS layout assignment

      Learning how NMOS and PMOS devices work together

      Wanting a visual, hands-on approach to digital logic

      Cheers, and happy building!

