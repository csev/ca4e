      In this walkthrough for Computer Architecture for Everybody, we explore how to build a clocked counter using a three-bit adder, a latch (register), and a clock signal in the Gates Layout Tool.

      Starting from basic components, we connect an adder and a three-bit latch to create a circuit that counts from 0 to 7. Along the way, we examine how latches store state, how clock signals control when values are copied, and why clocked circuits are essential to making counters—and CPUs—work reliably.

      The video demonstrates:

      How a three-bit adder produces sums from binary inputs

      How a latch functions as a small register

      How feedback loops work safely when controlled by a clock

      Using waypoints to clean up wiring and improve readability

      Turning a manually clocked circuit into an automatic, timed counter

      Visualizing the counter with outputs (and a Nixie display for fun)

      We also show how to load a prebuilt counter as a reference and compare it to the hand-constructed version.

      This walkthrough is intended to build intuition about state, timing, and clocked logic, which are foundational ideas in computer architecture.

      Thanks for watching, and happy circuit building!

