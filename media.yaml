    qt_creation: null
    tags: ca4e, ca4e-lecture
    description: |
      We look at the invention of transistors and the relationship between tubes and transistors.  We look at how the transistor enabled portable battery powered radio receivers and ho transistors are used in an analog audio amplification application.  We look at how transistors and their manufacturing evolved from BJT (Binary Junction Transistors) to NMOS,  PMOS, and eventually CMOS (Complimentary Metal on Silicon) that is in use inc chips today.  We look at how BJT transistors differ from digital transistors like NMOS and PMOS.

      We bid a fond farewell to tubes acknowledging their contribution to high-end audio amplifiers and how pretty they look in Nixie tube clocks.

      After this lecture we focus on transistors and adding the gate abstraction on top of transistors that allows us to design digital circuits without concern for the underlying transistor technology (BJT, PMOS, NMOS, CMOS).

      Course materials and assessments: https://www.ca4e.com

      For more materials, auto graders, and more courses, please see www.masterprogrammer.com.
