      In this walkthrough, we build a CMOS NAND gate step by step using the VLSI layout design tool from Computer Architecture for Everybody.

      Starting from the reference diagram, we lay out:

      PMOS transistors in parallel connected to VDD

      NMOS transistors in series connected to ground

      Polysilicon gates that form the transistors

      Metal routing and vias to connect layers correctly

      Along the way, we route inputs A and B, create a labeled output Q, and test the circuit by manually applying voltages to verify the NAND truth table. Once complete, we submit the design to the autograder, which checks all input combinations and confirms correct behavior.

      This walkthrough focuses on:

      Translating logic diagrams into physical VLSI layouts

      Understanding how CMOS structure enforces logic behavior

      Practical layout techniques like spacing, routing, and fixing mistakes

      Building confidence with slightly more complex gates

      If you’re learning how logic gates become silicon—or want hands-on practice with CMOS layout—this video is for you.

